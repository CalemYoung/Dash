name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Verify tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content build/installer/version.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match version 'v$version'."
          }

      - name: Build installer
        run: python build/scripts/build_installer.py

      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content build/installer/version.txt -Raw).Trim()
          $installer = "dist/DashSetup-$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }
          Get-Item $installer | Select-Object Name, Length

      - name: Write installer checksum
        shell: pwsh
        run: |
          # Dash's in-app updater refuses to run an installer that does not
          # match this file, so it must be published next to the exe.
          $version = (Get-Content build/installer/version.txt -Raw).Trim()
          $installer = "dist/DashSetup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$installer.sha256" -Value "$hash *DashSetup-$version.exe" -NoNewline
          Get-Content "$installer.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashSetup
          path: |
            dist/DashSetup-*.exe
            dist/DashSetup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DashSetup-*.exe
            dist/DashSetup-*.exe.sha256

  # Releases published by the job above use the workflow's own token, and
  # events raised with that token never trigger other workflows, so the
  # winget submission has to live here rather than in an on-release workflow.
  #
  # Needs, once: a fork of microsoft/winget-pkgs under the account that owns
  # a repository secret WINGET_TOKEN (fine-grained token on that fork with
  # Contents and Pull requests read/write). Without the secret this job
  # explains itself and exits cleanly.
  winget:
    needs: build-and-release
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - name: Check for token
        id: token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            Write-Host "WINGET_TOKEN secret is not set; skipping the winget submission."
            "present=false" >> $env:GITHUB_OUTPUT
          } else {
            "present=true" >> $env:GITHUB_OUTPUT
          }

      - name: Submit manifest update to winget-pkgs
        if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: CalemYoung.Dash
          installers-regex: 'DashSetup-.*\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
