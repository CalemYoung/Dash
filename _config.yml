# GitHub Pages site for Dash: the README rendered at calemyoung.github.io/Dash
# so the project has an indexable page with a plain title and description.
title: Dash launcher for Windows
tagline: A fast, predictable keyboard launcher for Windows
description: Dash is a fast, predictable keyboard launcher for Windows. Your apps, files, folders and websites are a few letters away, and the same thing opens every time.
url: https://calemyoung.github.io
baseurl: /Dash
theme: jekyll-theme-midnight
logo: assets/icons/icon.png
show_downloads: false
exclude:
  - .github
  - .venv
  - build
  - config
  - dist
  - packaging
  - src
  - "*.py"
  - "*.spec"
  - "*.qss"
  - requirements.txt
  - README.md
