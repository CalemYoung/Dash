[general]
# Alt+Space is the usual launcher key. Pick another under Settings if it
# clashes with something you use.
hotkey = "Alt+Space"
# Which display the launcher opens on: "mouse" (the one the pointer is on),
# "primary", or a display's name as listed in Settings. It is always centered
# on that display, so it never gets left behind on the screen it last used.
launcher_screen = "mouse"
# Browser for website commands: "default" for the Windows default, or a
# browser chosen from the list in Settings. A command can override this.
browser = "default"
# Look for a new release once each time Dash starts and show a single tray
# notification if there is one. Nothing is installed until you choose to.
check_updates_on_startup = true
# When nothing matches, offer to search the web for what was typed. {query}
# marks where the text goes.
web_search = "https://www.google.com/search?q={query}"
# Turn on to also offer a web search, first, when nothing matches.
web_search_enabled = false
# Opening an app that is already running brings its window to the front
# instead of starting another copy.
switch_to_open_apps = true
# Hide the launcher when you click somewhere else, like the Start menu does.
hide_when_focus_lost = true
# Fetch each website's icon from the site (via Google's or DuckDuckGo's
# favicon service when the site has none). Turn off to make no requests for
# icons; website commands then use the default website icon.
download_favicons = true

[ui]
# "system" follows the Windows light or dark app mode; "light" or "dark" fixes it.
theme = "system"
program_width = 600
search_height = 70
# Sized to five whole result rows; the list snaps to whole rows anyway.
results_height = 288
editor_height = 600
window_opacity = 1.0
search_font_size = 20
result_font_size = 13
description_font_size = 10
show_clock = true
clock_font_size = 10

[search]
max_results = 20
autocomplete = true
# Match names and aliases regardless of capitalization.
ignore_case = true
# Also match the start of any word in a name, so "code" finds "Visual Studio
# Code". These matches always come after names that start with what you typed.
match_word_starts = true
# "popularity" puts the most-run matches first (ties by name); "name" is alphabetical.
sort_results = "popularity"
show_descriptions = true
# Counts are always recorded; this only controls whether the pill is shown.
show_run_counter = false
# Pencil button on each result for editing with the mouse. Ctrl+Enter edits
# the selected result either way.
show_edit_button = true
# The command tree panel shows how each typed letter narrows the matches.
# Off by default to keep the launcher to a single column; turn it on in Settings.
show_command_tree = false

[shortcuts]
edit_selected_command = "Ctrl+Return"
new_command = "Ctrl+N"
open_settings = "Ctrl+,"

[paths]
program_icon = "assets/icons/icon.png"
default_command_icon = "assets/icons/icon.png"
folder_icon = "assets/icons/folder.png"
file_icon = "assets/icons/file.png"
url_command_icon = "assets/icons/url.svg"
calculator_icon = "assets/icons/calculator.png"
no_result_icon = "assets/icons/no_result.png"
settings_command_icons = "assets/icons/settings.png"
quit_command_icon = "assets/icons/quit.png"
